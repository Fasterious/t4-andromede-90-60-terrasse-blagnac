<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="{{description}}" />
    <meta name="theme-color" content="#1e5631" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{titre}} · {{quartier}}" />
    <meta property="og:description" content="{{prix}} net vendeur, sans frais d’agence. Photos, vidéo, quartier et points d’attention en toute transparence." />
    <meta property="og:image" content="/photos/01-terrasse.png" />
    <meta property="og:locale" content="fr_FR" />
    <title>{{titre}} · {{quartier}}</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-top">
        <h1>90,5 m² + 63 m² de terrasse</h1>
        <button type="button" class="btn-share" id="share-btn" aria-label="Partager cette annonce">
          <svg class="icon-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
            <line x1="15.4" y1="6.5" x2="8.6" y2="10.5"></line>
          </svg>
          <span>Partager</span>
        </button>
      </div>
      <p class="subtitle"><!-- SOUS_TITRE --></p>
<!-- EN_DIRECT -->
      <p class="price">{{prix}}</p>
      <p class="price-note">{{prixNote}}</p>
<!-- HEADER_EXTRAS -->
      <div class="header-ctas">
        <button type="button" class="btn-primary" data-open-visit>Demander une visite</button>
        <button type="button" class="btn-outline" data-open-chat>Poser une question</button>
      </div>
    </header>

    <section class="gallery-section" aria-label="Photos du bien">
      <div class="gallery-toolbar">
        <h2>Photos</h2>
        <button type="button" class="btn-fullscreen" id="open-gallery">
          Plein écran
        </button>
      </div>
      <div class="gallery" id="gallery"></div>
    </section>

    <main class="content">
<!-- SECTIONS -->
    </main>

    <section class="block contact-block" id="contact" aria-labelledby="contact-titre">
      <h2 id="contact-titre">Nous contacter</h2>
      <p class="contact-intro">Une question, une photo en plus, une visite ? Écrivez-nous directement.</p>
      <p class="contact">
        {{noms}} <span class="sep" aria-hidden="true">·</span> <a href="tel:{{telephoneIntl}}" data-track="tel_click">{{telephone}}</a>
      </p>
      <p class="contact-whatsapp">
        <a
          href="https://wa.me/{{whatsapp}}"
          class="btn-whatsapp"
          id="wa-direct"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Écrire sur WhatsApp"
          data-track="whatsapp_click"
        >
          <svg class="icon-whatsapp" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.435 9.884-9.884 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
          </svg>
          Écrire sur WhatsApp
        </a>
      </p>
      <p class="muted small">Données personnelles : voir la section <a href="#confidentialite">Confidentialité</a>.</p>
    </section>

    <div class="lightbox" id="lightbox" hidden aria-hidden="true" role="dialog" aria-label="Visionneuse photos">
      <button type="button" class="lb-close" id="lb-close" aria-label="Fermer">×</button>
      <button type="button" class="lb-share" id="lb-share-btn" aria-label="Partager cette annonce">
        <svg class="icon-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
          <line x1="15.4" y1="6.5" x2="8.6" y2="10.5"></line>
        </svg>
      </button>
      <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="Photo précédente">‹</button>
      <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="Photo suivante">›</button>
      <div class="lb-stage" id="lb-stage">
        <div class="lb-slide" id="lb-slide-prev">
          <div class="lb-slide-bg"></div>
          <img class="lb-slide-img" alt="" draggable="false" />
        </div>
        <div class="lb-slide" id="lb-slide-curr">
          <div class="lb-slide-bg"></div>
          <img class="lb-slide-img" alt="" draggable="false" />
        </div>
        <div class="lb-slide" id="lb-slide-next">
          <div class="lb-slide-bg"></div>
          <img class="lb-slide-img" alt="" draggable="false" />
        </div>
      </div>
      <div class="lb-bottom">
        <div class="lb-footer">
          <span id="lb-caption"></span>
          <span id="lb-counter"></span>
        </div>
        <div class="lb-thumbs" id="lb-thumbs" role="tablist" aria-label="Miniatures"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
